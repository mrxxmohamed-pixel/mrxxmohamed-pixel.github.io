<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة التحكم | مفتاحك</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Changa:wght@300;400;600;700&family=El+Messiri:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="admin-body">
    <div class="admin-topbar">
      <div class="container admin-topbar-inner">
        <div>
          <h1>لوحة التحكم</h1>
          <p>تحكم بالمحتوى، الأسعار، والتواصل بسهولة.</p>
        </div>
        <button class="btn btn-secondary" id="logout" type="button">تسجيل خروج</button>
      </div>
    </div>

    <main class="admin-content">
      <div class="container">
        <div
          id="authOverlay"
          style="display: none; position: fixed; inset: 0; background: rgba(15,14,12,0.65); backdrop-filter: blur(8px); z-index: 30; place-items: center;"
        >
          <div class="admin-card" style="width: min(420px, 90vw);">
            <h3>الدخول للوحة التحكم</h3>
            <p>ادخل رمز الدخول لتعديل الموقع.</p>
            <input class="input" type="password" id="pinInput" placeholder="رمز الدخول" />
            <button class="btn btn-primary" id="pinButton" type="button">دخول</button>
            <p id="pinError" style="color: #b11a1a;"></p>
          </div>
        </div>

        <div class="admin-card">
          <h3>البيانات الاساسية</h3>
          <div class="admin-grid">
            <div>
              <label>اسم العلامة</label>
              <input class="input" id="brandName" type="text" />
            </div>
            <div>
              <label>السطر التعريفي</label>
              <input class="input" id="brandTagline" type="text" />
            </div>
            <div>
              <label>زمن الرد</label>
              <input class="input" id="brandResponse" type="text" />
            </div>
            <div>
              <label>زر الاتصال</label>
              <input class="input" id="ctaPrimary" type="text" />
            </div>
            <div>
              <label>زر واتساب</label>
              <input class="input" id="ctaSecondary" type="text" />
            </div>
          </div>
        </div>

        <div class="admin-card">
          <h3>قسم البطل</h3>
          <div class="admin-grid">
            <div>
              <label>عنوان رئيسي</label>
              <input class="input" id="heroTitle" type="text" />
            </div>
            <div>
              <label>نص فرعي</label>
              <input class="input" id="heroSubtitle" type="text" />
            </div>
            <div>
              <label>شارة</label>
              <input class="input" id="heroBadge" type="text" />
            </div>
            <div>
              <label>إبراز</label>
              <input class="input" id="heroHighlight" type="text" />
            </div>
          </div>
        </div>

        <div class="admin-card">
          <h3>نبذة عني</h3>
          <div class="admin-grid">
            <div>
              <label>عنوان القسم</label>
              <input class="input" id="aboutTitle" type="text" />
            </div>
            <div>
              <label>النص</label>
              <textarea class="input" id="aboutBody"></textarea>
            </div>
          </div>
        </div>

        <div class="admin-card">
          <h3>الاسعار</h3>
          <div class="admin-card-header">
            <span class="admin-hint">حدث الباقات بدون JSON.</span>
            <button class="btn btn-secondary" id="addPricing" type="button">اضافة باقة</button>
          </div>
          <div class="pricing-editor" id="pricingEditor"></div>
        </div>

        <div class="admin-card">
          <h3>معلومات التواصل</h3>
          <div class="admin-grid">
            <div>
              <label>الجوال</label>
              <input class="input" id="contactPhone" type="text" />
            </div>
            <div>
              <label>واتساب</label>
              <input class="input" id="contactWhatsapp" type="text" />
            </div>
            <div>
              <label>البريد الالكتروني</label>
              <input class="input" id="contactEmail" type="email" />
            </div>
            <div>
              <label>نطاق الخدمة</label>
              <input class="input" id="contactAddress" type="text" />
            </div>
            <div>
              <label>الساعات</label>
              <input class="input" id="contactHours" type="text" />
            </div>
          </div>
        </div>

        <div class="admin-card">
          <h3>روابط السوشال</h3>
          <div class="admin-grid">
            <div>
              <label>انستغرام</label>
              <input class="input" id="instagramLink" type="text" />
            </div>
            <div>
              <label>تيك توك</label>
              <input class="input" id="tiktokLink" type="text" />
            </div>
            <div>
              <label>سناب شات</label>
              <input class="input" id="snapchatLink" type="text" />
            </div>
          </div>
        </div>

        <div class="admin-card">
          <h3>رمز الدخول</h3>
          <div class="admin-grid">
            <div>
              <label>رمز جديد</label>
              <input class="input" id="adminPin" type="password" />
            </div>
          </div>
        </div>

        <div class="admin-card">
          <div class="admin-actions">
            <button class="btn btn-primary" id="saveQuick" type="button">حفظ سريع</button>
            <button class="btn btn-secondary" id="exportData" type="button">تصدير JSON</button>
            <button class="btn btn-secondary" id="resetData" type="button">اعادة ضبط</button>
            <span id="status"></span>
          </div>
        </div>

        <div class="admin-card">
          <h3>رسائل العملاء</h3>
          <table class="table">
            <thead>
              <tr>
                <th>الاسم</th>
                <th>الجوال</th>
                <th>الرسالة</th>
                <th>الوقت</th>
              </tr>
            </thead>
            <tbody id="messagesBody"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/admin.js"></script>
  </body>
</html>
